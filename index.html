<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Índice de Páginas - vertice2026</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="powerpoint.html">PowerPoint</a></li>

      <h1>O Vértice Central</h1>
      <p>A teia de múltiplos esquemas mapeada com provas e convicção.</p>

    <div class="filters">
      <div class="filter-group">
        <label for="category-filter">Filtrar por Categoria:</label>
        <select id="category-filter">
          <option value="">Todas as Categorias</option>
          <!-- Options dynamically populated by JS -->
        </select>
      </div>
      <div class="filter-group">
        <label for="search-input">Buscar (Títulos, Tags, etc.):</label>
        <input type="text" id="search-input" placeholder="Digite para buscar...">
      </div>
    </div>

    <main>
      <div id="cards-container" class="cards-container">
        <!-- Cards dynamically populated by JS -->
      </div>
    </main>

    <section class="intro-text" style="background: #fff; padding: 20px; border-radius: 8px; margin-top: 30px; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center;">
      <p><strong>Aviso:</strong> Este é um trabalho em progresso e está aberto para que qualquer pessoa possa corrigir e complementar as fontes.</p>
    </section>

  </div>

  <!-- Import data structure first -->
  <script src="assets/js/data.js"></script>
  <!-- Import main application logic -->

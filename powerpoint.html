<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerPoint - vertice2026</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .gallery-container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 30px;
      text-align: center;
    }
    .gallery-image {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      display: none;
    }
    .gallery-image.active {
      display: inline-block;
    }
    .gallery-controls {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .gallery-controls button {
      padding: 10px 20px;
      background-color: #3498db;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .gallery-controls button:hover {
      background-color: #2980b9;
    }
    .download-section {
      text-align: center;
      margin-top: 40px;
    }
    .btn-download {
      display: inline-block;
      padding: 15px 30px;
      background-color: #e74c3c;
      color: #fff;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }
    .btn-download:hover {
      background-color: #c0392b;
      transform: translateY(-2px);
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      padding-top: 50px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.9);
    }
    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 80vh;
      object-fit: contain;
    }
    .modal-caption {
      margin: auto;
      display: block;
      width: 80%;
      max-width: 700px;
      text-align: center;
      color: #ccc;
      padding: 10px 0;
      font-size: 1.2rem;
    }
    .close-modal {
      position: absolute;
      top: 15px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
    }
    .close-modal:hover,
    .close-modal:focus {
      color: #bbb;
      text-decoration: none;
      cursor: pointer;
    }
    .gallery-image {
      cursor: pointer;
    }
    #slide-description {
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="powerpoint.html">PowerPoint</a></li>
      </ul>
    </nav>
    <header>
      <h1>Apresentação PowerPoint</h1>
      <p>Confira os slides com os infográficos em detalhes ou faça o download para editar.</p>
    </header>

    <main>
      <div class="gallery-container">
        <div id="slides-container">
          <!-- Images dynamically populated by JS -->
        </div>
        <p id="slide-description" style="margin-top: 10px; color: #555;"></p>

        <div class="gallery-controls">
          <button id="prev-btn">Anterior</button>
          <span id="slide-counter" style="align-self: center; font-weight: bold;">1 / 4</span>
          <button id="next-btn">Próximo</button>
        </div>
      </div>

      <div class="download-section">
        <h2>Gostou? Baixe o arquivo original!</h2>
        <p>Você pode baixar o arquivo PPTX para explorar e usar os infográficos na sua apresentação.</p>
        <br>
        <a href="PowerPoint/Vértice Central-2026.pptx" class="btn-download" download>Baixar PPTX</a>
      </div>
    </main>
  </div>

  <!-- Modal for full-size images -->
  <div id="image-modal" class="modal">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="modal-img">
    <div id="modal-caption" class="modal-caption"></div>
  </div>

  <script>
    const slidesData = [
      {
        src: "PowerPoint/Vértice_Central-2026-PNG/Slide1.PNG",
        alt: "Slide 1",
        description: "Visão geral do esquema de corrupção."
      },
      {
        src: "PowerPoint/Vértice_Central-2026-PNG/Slide2.PNG",
        alt: "Slide 2",
        description: "Detalhes dos operadores financeiros."
      },
      {
        src: "PowerPoint/Vértice_Central-2026-PNG/Slide3.PNG",
        alt: "Slide 3",
        description: "Conexões com o núcleo político."
      },
      {
        src: "PowerPoint/Vértice_Central-2026-PNG/Slide4.PNG",
        alt: "Slide 4",
        description: "Impacto e desdobramentos."
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const slidesContainer = document.getElementById('slides-container');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const counter = document.getElementById('slide-counter');
      const descriptionEl = document.getElementById('slide-description');

      // Render slides
      slidesData.forEach((slide, index) => {
        const img = document.createElement('img');
        img.src = slide.src;
        img.alt = slide.alt;
        img.className = 'gallery-image';
        if (index === 0) img.classList.add('active');
        img.dataset.index = index;
        slidesContainer.appendChild(img);
      });

      const slides = document.querySelectorAll('.gallery-image');
      let currentIndex = 0;

      function updateGallery() {
        slides.forEach((slide, index) => {
          if (index === currentIndex) {
            slide.classList.add('active');
          } else {
            slide.classList.remove('active');
          }
        });
        counter.textContent = `${currentIndex + 1} / ${slides.length}`;
        descriptionEl.textContent = slidesData[currentIndex].description;
      }

      // Initial update to show description
      updateGallery();

      // Modal logic
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      const modalCaption = document.getElementById('modal-caption');
      const closeModal = document.querySelector('.close-modal');

      function openModal() {
        modal.style.display = "block";
        modalImg.src = slidesData[currentIndex].src;
        modalCaption.textContent = slidesData[currentIndex].description;
      }

      slidesContainer.addEventListener('click', (e) => {
        if (e.target.tagName === 'IMG') {
          openModal();
        }
      });

      descriptionEl.addEventListener('click', () => {
        openModal();
      });

      closeModal.addEventListener('click', () => {
        modal.style.display = "none";
      });

      window.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.style.display = "none";
        }
      });

      prevBtn.addEventListener('click', () => {
        currentIndex = (currentIndex > 0) ? currentIndex - 1 : slides.length - 1;
        updateGallery();
      });

      nextBtn.addEventListener('click', () => {
        currentIndex = (currentIndex < slides.length - 1) ? currentIndex + 1 : 0;
        updateGallery();
      });
    });
  </script>
</body>
</html>
